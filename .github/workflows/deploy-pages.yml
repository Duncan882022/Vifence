name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # docs/ đã được build local (npm run build:pages) rồi commit vào main —
      # KHÔNG rebuild ở CI vì src trên main có thể chưa sync với build local.
      - name: Verify docs/ exists
        run: test -f docs/index.html

      # Cách 1: GitHub Actions Pages (khi Settings → Source = GitHub Actions)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy via GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Cách 2: nhánh gh-pages (khi Settings → Source = branch gh-pages / root)
      - name: Deploy gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
          single-commit: true
