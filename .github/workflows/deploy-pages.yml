name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Vite dev index.html
        run: cp scripts/index.dev.html index.html

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: Sync build to repo root (Pages main/root)
        run: bash scripts/sync-pages-to-root.sh

      - name: Verify docs build
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          test -f docs/module05/index.html
          grep -q 'assets/index-' docs/index.html

      # Luôn publish — hoạt động khi Settings → Pages → branch gh-pages / (root)
      - name: Publish gh-pages branch
        id: publish_branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy Pages from Actions ${{ github.sha }}"

      # Cần owner bật Pages lần đầu — GITHUB_TOKEN không đủ quyền create site
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Legacy Pages hay trỏ nhầm main/ (index Vite dev → 404 asset). Ép gh-pages khi token đủ quyền.
      - name: Point Pages source to gh-pages
        continue-on-error: true
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"

      - name: Pages chưa bật — hướng dẫn
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages chưa được bật cho repo này."
          echo "Build đã push lên nhánh gh-pages. Bật thủ công một lần:"
          echo "  Settings → Pages → Deploy from branch → gh-pages / (root)"
          echo "Fallback FE (Contabo): https://217.217.253.247.nip.io/Vifence/module05/"
          exit 0
