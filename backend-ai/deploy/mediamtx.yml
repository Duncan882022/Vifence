# MediaMTX — ingest thống nhất cho helmet camera.
#
# Vai trò: nhận luồng từ mọi loại mũ (bodycam RTSP hoặc điện thoại WHIP), rồi
# fan-out cho ba nhánh tiêu thụ độc lập:
#
#   record (copy, không re-encode) ──▶ playback / xuất clip, chất lượng nguyên bản
#   RTSP nội bộ ──────────────────────▶ backend AI decode ở chất lượng đầy đủ
#   WHEP + HLS ───────────────────────▶ CMS xem live
#
# Nguyên tắc: KHÔNG cho AI đọc luồng đã hạ chất lượng. Việc giảm chất lượng chỉ
# phục vụ mắt người xem, không phục vụ detect.
#
# Chạy: mediamtx /path/to/mediamtx.yml

logLevel: info

###############################################
# Giao thức

# RTSP — bodycam phần cứng publish vào đây, và backend AI pull từ đây.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

# WebRTC — WHIP (điện thoại publish) + WHEP (CMS xem).
webrtc: yes
webrtcAddress: :8889
# Địa chỉ công khai để ICE hoạt động sau NAT — IP của chính VPS chạy MediaMTX.
webrtcAdditionalHosts: [217.217.253.247]
# STUN — điện thoại 4G chỉ có host candidate (IP nội bộ nhà mạng). Thiếu srflx
# thì phiên phát sống nhờ peer-reflexive và chết hẳn mỗi lần NAT đổi cổng.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# Bật thêm TURN khi mũ chạy sau NAT đối xứng (một số nhà mạng 4G):
# webrtcICEServers2:
#   - url: turn:turn.vifence.io:3478
#     username: vifence
#     password: doi-mat-khau-nay

# HLS — dự phòng khi UDP bị chặn (firewall văn phòng).
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
# LL-HLS của MediaMTX bắt buộc >= 7 segment; đặt thấp hơn thì muxer bị huỷ ngay
# khi tạo và mọi request index.m3u8 trả 404.
hlsSegmentCount: 7
# Bodycam qua 4G đứt RTSP vài chục giây một lần. Với `no`, mỗi lần đứt là muxer
# bị huỷ, playlist trả 404 và trình phát phải khởi tạo lại từ đầu — đó chính là
# cú khựng người xem thấy. Giữ muxer sống để nguồn nối lại là hình chạy tiếp.
hlsAlwaysRemux: yes

rtmp: yes
rtmpAddress: :1935
srt: no

# Playback — đọc lại băng đã ghi bên dưới.
#
# Băng vẫn được ghi từ trước nhưng không có đường nào đọc ra, nên CMS phải
# dựng playback giả trỏ vào luồng live. Bật server này là có băng thật mà
# backend không tốn thêm CPU nào: MediaMTX đọc thẳng file fmp4 đã ghi.
#
#   GET /list?path=hc-02                      → các đoạn băng còn giữ
#   GET /get?path=hc-02&start=<ISO8601>&duration=<giây>
#
# Nhớ proxy qua nginx như hai cổng kia:
#   location /mediamtx/playback/ { proxy_pass http://127.0.0.1:9996/; }
playback: yes
playbackAddress: :9996

###############################################
# Ghi hình — nguyên bản, phục vụ playback

pathDefaults:
  # Copy stream vào file, không re-encode: giữ đúng chất lượng đã phát lên và
  # gần như không tốn CPU.
  record: yes
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  # Giữ 7 ngày — chỉnh theo dung lượng đĩa VPS.
  recordDeleteAfter: 168h

###############################################
# Path theo từng mũ

paths:
  # HC-01 — bodycam của hãng phát RTSP ở gateway riêng.
  #
  # Không pull thẳng bằng `source:` được: gateway gửi timestamp nhảy lùi
  # (`DTS is not monotonically increasing`) khoảng 35 giây một lần, đủ để giết
  # muxer HLS — playlist trả 404 và trình phát phải khởi tạo lại, đúng cú khựng
  # người xem thấy. Track AAC kèm theo cũng không dùng vào việc gì.
  #
  # ffmpeg đứng giữa dựng lại timestamp theo đồng hồ hệ thống và bỏ audio.
  # `-c:v copy` nên không hề encode lại: hình giữ nguyên chất lượng gốc.
  hc-01:
    source: publisher
    runOnInit: /opt/vifence/rtsp-relay.sh rtsp://157.66.100.182:8554/866926048126915 rtsp://127.0.0.1:8554/hc-01 8
    runOnInitRestart: yes

  # HC-02 — trình duyệt publish WHIP tại /hc-02/whip (giữ tab mở).
  # RTMP tùy chọn: rtmp://<vps>:1935/hc-02 — chỉ khi bật qua env FE.
  hc-02:
    source: publisher

  # DR-03 — flycam DJI Mavic Air push RTMP vào đây (rtmp://<vps>:1935/dr03).
  # Backend VMS pull RTSP nội bộ → relay HLS cho CMS.
  dr03:
    source: publisher

  # Bí danh của `dr03`. CMS suy path từ id camera nên dựng ra `dr-03`; giữ cả hai
  # tên để bản FE cũ và mới cùng xem được, drone vẫn chỉ publish vào `dr03`.
  #
  # Không ghi ở đây: bí danh chỉ pull lại từ `dr03` vốn đã ghi rồi, bật thêm là
  # tốn gấp đôi đĩa cho cùng một hình. Playback của drone đọc path `dr03`.
  dr-03:
    source: rtsp://127.0.0.1:8554/dr03
    sourceProtocol: tcp
    sourceOnDemand: yes
    record: no

  # Chặn path lạ tự tạo — chỉ nhận đúng mũ đã khai báo.
  all_others:
    source: publisher
    record: no

###############################################
# TLS — BẮT BUỘC khi CMS chạy trên HTTPS (GitHub Pages)
#
# Trang HTTPS không gọi được endpoint HTTP (mixed content) và getUserMedia cũng
# đòi secure context. Hai cách:
#
#   1. Proxy qua nginx sẵn có trên VPS (khuyến nghị — dùng luôn cert nip.io):
#        location /mediamtx/webrtc/ { proxy_pass http://127.0.0.1:8889/; }
#        location /mediamtx/hls/    { proxy_pass http://127.0.0.1:8888/; }
#      rồi đặt VITE_MEDIAMTX_WEBRTC_URL=https://<host>/mediamtx/webrtc
#      Nhớ bật WebSocket upgrade và tắt buffering cho hai location này.
#
#   2. Cho MediaMTX tự nắm cert:
#        webrtcEncryption: yes
#        webrtcServerCert: /etc/letsencrypt/live/<host>/fullchain.pem
#        webrtcServerKey:  /etc/letsencrypt/live/<host>/privkey.pem
#
# Lưu ý: proxy chỉ lo phần signaling. Media WebRTC vẫn đi UDP trực tiếp nên
# phải mở dải cổng ICE (mặc định 8189/udp) trên firewall.

###############################################
# Xác thực WHIP/WHEP — chỉ bật khi đã set creds trên CMS + backend.
# authInternalUsers trong repo là ví dụ; bật sớm mà thiếu VITE_WHIP_* → phone/CMS 401.
#
# authInternalUsers:
#   - user: helmet
#     pass: doi-mat-khau-whip-publish
#     ips: []
#     permissions:
#       - action: publish
#   - user: cms
#     pass: doi-mat-khau-whip-read
#     permissions:
#       - action: read
